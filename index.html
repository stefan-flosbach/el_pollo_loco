    <!-- Startscreen -->
    <div id="startscreen">

    <canvas id="canvas" width="720" height="480">



    </canvas>

    <button id="restartBtn" style="display: none;">
  Restart
</button>


    <!-- Touch Control Buttons -->
    <div id="touch-controls">
        <button class="touch-btn" id="btn-left">◀</button>
        <button class="touch-btn" id="btn-right">▶</button>

    </div>


    <h2>
        <div class="legend">
            <ul>
                <li> &#8658 : run right </li>
                <li> &#8656 : run left </li>
            </ul>
            <ul>
                <li> &#8657 or space : jump </li>
                <li> D : throw bottle </li>
            </ul>
        </div>
    </h2>
